name: build cli

on:
  pull_request:
    paths:
      - 'cli/**'
      - '.github/workflows/build_cli.yaml'
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build_packages:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version-file: 'cli/.nvmrc'

      - name: build
        run: |
          cd cli
          yarn && yarn build
          npm install -g pkg
          pkg package.json

  publish_docker:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: emqx/mqttx-cli
          flavor: |
            latest=${{ !github.event.release.prerelease }}
          tags: |
            type=ref,event=tag

      - name: set up qemu
        uses: docker/setup-qemu-action@v2

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v2

      - name: login to docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v3
        with:
          context: ./cli
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}

  publish_npm:
    if: (github.event_name == 'release' && !github.event.release.prerelease) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'cli/.nvmrc'
      - name: build
        run: |
          cd cli
          yarn && yarn build
      - name: set up npm publishing
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: upgrade npm
        run: npm install -g npm@11.5.1
      - name: verify trusted publishing
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd cli
          npm version prerelease --preid=preflight --no-git-tag-version
          npm publish --dry-run --provenance --access public --tag preflight --loglevel=verbose 2>&1 | tee "$RUNNER_TEMP/npm-preflight.log"
          grep -q 'npm verbose oidc Successfully retrieved and set token' "$RUNNER_TEMP/npm-preflight.log"
      - name: publish
        if: github.event_name == 'release'
        run: |
          cd cli
          npm publish --provenance --access public
